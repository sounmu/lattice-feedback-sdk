<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flow 테스트 첫 화면</title>
  </head>
  <body>
    <main>
      <h1>Flow 첫 화면</h1>
      <p>이 문장과 아래 표의 셀도 Comment와 Edit 대상으로 선택할 수 있습니다.</p>
      <table>
        <thead><tr><th>계약서</th><th>상태</th></tr></thead>
        <tbody><tr><td>가상 고객 계약서</td><td>검토 중</td></tr></tbody>
      </table>
      <label>입력값 미수집 확인 <input data-feedback-id="test-input" autocomplete="off"></label>
      <button data-feedback-id="save-button" type="button">저장</button>
      <p id="save-result" role="status">첫 화면 저장 전</p>
      <a data-feedback-id="next-page" href="/second/">다음 문서로 이동</a>
    </main>
    <script src="http://localhost:3000/sdk.js" data-project-key="demo"
      data-capture-policy='{"allowedPaths":["/first/","/second/"],"targets":[{"id":"test-input","selector":"[data-feedback-id=\"test-input\"]"},{"id":"save-button","selector":"[data-feedback-id=\"save-button\"]"},{"id":"next-page","selector":"[data-feedback-id=\"next-page\"]"}]}'
      onload="window.LatticeFeedback.setUser({id:'flow-test',name:'Flow Test'})"></script>
    <script src="/flow-demo.js"></script>
  </body>
</html>
